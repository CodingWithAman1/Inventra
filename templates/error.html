{% extends "base.html" %}
{% block title %}{{ error_title|default("Notice") }} - INVENTRA{% endblock %}
{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="display-3 text-{{ error_color|default('warning') }} mb-3">
                    <i class="bi bi-{{ error_icon|default('exclamation-triangle-fill') }}"></i>
                </div>
                <h3 class="fw-bold mb-2">{{ error_title|default("Page Not Found") }}</h3>
                <p class="text-muted mb-4">{{ error_message|default("The requested URL was not found on this server.") }}</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('home') }}" class="btn btn-primary px-4 shadow-sm"><i class="bi bi-house-door"></i> Dashboard</a>
                    <a href="{{ url_for('inventory') }}" class="btn btn-outline-secondary px-4"><i class="bi bi-box-seam"></i> Inventory</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
